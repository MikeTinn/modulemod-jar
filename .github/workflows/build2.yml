name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Unzip project
        run: unzip -q MaceMain.zip -d project

      # The addon compiles against your already-built client jar. Put it in the repo root as autism-client.jar.
      - name: Add client jar
        run: |
          mkdir -p project/MaceMain/libs
          if [ -f autism-client.jar ]; then cp autism-client.jar project/MaceMain/libs/; fi
          if ! ls project/MaceMain/libs/*.jar >/dev/null 2>&1; then
            echo "::error::No client jar found. Add your built AUTISM Client jar to the repo root as autism-client.jar."
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
        working-directory: project/MaceMain

      - name: Build MaceMain addon
        run: ./gradlew build --no-daemon -x test
        working-directory: project/MaceMain

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: MaceMain
          path: |
            project/MaceMain/build/libs/*.jar
            !project/MaceMain/build/libs/*-sources.jar
          if-no-files-found: error
