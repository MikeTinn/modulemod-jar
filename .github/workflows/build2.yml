name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Unzip project
        run: unzip -q MaceMain.zip -d project

      # The addon only compiles against the built client jar (nothing from the client is rebuilt).
      - name: Add client jar
        run: cp autism-client.jar project/MaceMain/libs/

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
        working-directory: project/MaceMain

      - name: Build MaceMain addon
        run: ./gradlew build --no-daemon -x test
        working-directory: project/MaceMain

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: MaceMain
          path: |
            project/MaceMain/build/libs/*.jar
            !project/MaceMain/build/libs/*-sources.jar
          if-no-files-found: error
