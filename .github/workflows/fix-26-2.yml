name: Fix 26.2 part 2
on: workflow_dispatch

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Apply renames
        run: |
          python3 - <<'PY'
          import re, pathlib
          for f in pathlib.Path("src/main/java").rglob("*.java"):
              t = f.read_text(encoding="utf-8")
              o = t
              # GuiGraphicsExtractor draw methods
              t = re.sub(r'\b(ctx|c|g|graphics)\.drawString\(', r'\1.text(', t)
              t = re.sub(r'\b(ctx|c|g|graphics)\.renderItemDecorations\(', r'\1.itemDecorations(', t)
              t = re.sub(r'\b(ctx|c|g|graphics)\.renderItem\(', r'\1.item(', t)
              # chat and tab list moved from Gui to Hud
              t = t.replace('.gui.getChat()', '.gui.hud.getChat()')
              t = t.replace('.gui.getTabList()', '.gui.hud.getTabList()')
              # player layer: render -> submit
              if f.name == "CosmeticsFeature.java":
                  t = t.replace('public void render(PoseStack', 'public void submit(PoseStack')
              # chat head object now takes a fallback component
              t = re.sub(r'(new ObjectContents\(\s*new PlayerSprite\(.*?Modules\.CH_HEAD_HAT\.bool\))\)',
                         r'\1, java.util.Optional.empty())', t, flags=re.S)
              if t != o:
                  f.write_text(t, encoding="utf-8")
                  print("changed", f)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "26.2 API renames part 2" && git push)

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set +e
          gradle build --console=plain > build.log 2>&1
          code=$?
          echo "=== COMPILE ERRORS ==="
          sed -n '1,/FAILURE:/p' build.log | grep -E -A2 "error:" | sed 's#/home/runner/work/[^/]*/[^/]*/src/main/java/com/modulesmod/##' | head -600
          exit $code

      - name: Dump 26.2 API signatures
        if: always()
        run: |
          CP=$(find ~/.gradle -name '*.jar' | grep -i minecraft | grep -v -e sources -e fabric-api -e fabric-loader | tr '\n' ':')
          for j in $(echo "$CP" | tr ':' ' '); do unzip -Z1 "$j" 2>/dev/null | grep '^net/minecraft/.*\.class$' | sed "s#\$# $j#"; done > classes.txt
          fqn() { grep -E "/$1\.class " classes.txt | awk '{print $1}' | sed 's#/#.#g; s#\.class$##' | head -3; }
          echo "=== WHERE CLASSES LIVE ==="
          for n in GuiMessage GuiMessageTag MultiBufferSource LevelRenderState PlayerFaceExtractor PlayerFaceRenderer ChatComponent PlayerTabOverlay TeamColor RenderTarget; do echo "$n: $(fqn $n | tr '\n' ' ')"; done
          show() { F=$(fqn $1 | head -1); echo "=== $1 ($F)"; if [ -n "$F" ]; then javap -p -cp "$CP" "$F" | grep -E "${2:-.}"; fi; }
          show GuiGraphicsExtractor ' text\(| item\(| itemDecorations\(| fill\(|outline|blit\('
          show EditBox 'ilter|Predicate|ormatter'
          show Gui 'hat|ab|hud|creen'
          show Hud 'hat|ab|verlay'
          show EntityModel 'etup|nim|root'
          show RenderLayer 'submit|render'
          show ObjectContents '.'
          show Team 'olor'
          show TeamColor '.'
          show PlayerFaceExtractor '.'
          show Minecraft 'RenderTarget|renderTarget'
          show Options 'ide'
          show LocalPlayer 'essage|verlay'
          show HudElement '.'
          show ChatComponent 'essage|ender|xtract'
          show LevelRenderer 'utline'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modulesmod-jar
          path: build/libs/modulesmod-*.jar

      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
