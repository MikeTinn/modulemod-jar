name: Fix 26.2 part 4
on: workflow_dispatch

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Apply renames
        run: |
          python3 - <<'PY'
          import re, pathlib
          for f in pathlib.Path("src/main/java").rglob("*.java"):
              t = f.read_text(encoding="utf-8")
              o = t
              # chat: only the 3-argument addMessage exists now
              t = re.sub(r'getChat\(\)\.addMessage\((.*)\);',
                         r'getChat().addMessage(\1, (net.minecraft.network.chat.MessageSignature) null, (net.minecraft.client.multiplayer.chat.GuiMessageTag) null);',
                         t)
              # EditBox has no setFilter any more
              t = re.sub(r'\bhexField\.setFilter\(.*\);', 'hexField.setMaxLength(6);', t)
              # menu player preview (extract naming)
              t = t.replace('renderEntityInInventoryFollowsMouse', 'extractEntityInInventoryFollowsMouse')
              if t != o:
                  f.write_text(t, encoding="utf-8")
                  print("changed", f)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "26.2 API renames part 4" && git push)

      - name: Build and report
        id: build
        continue-on-error: true
        run: |
          set +e
          gradle build --console=plain > build.log 2>&1
          code=$?
          echo "=== COMPILE ERRORS ==="
          sed -n '1,/FAILURE:/p' build.log | grep -E -A2 "error:" | sed 's#/home/runner/work/[^/]*/[^/]*/src/main/java/com/modulesmod/##' | head -600
          echo
          echo "=== API SIGNATURES ==="
          CP=$(find ~/.gradle -name '*.jar' | grep -i minecraft | grep -v -e sources -e fabric-api -e fabric-loader | tr '\n' ':')
          for j in $(echo "$CP" | tr ':' ' '); do unzip -Z1 "$j" 2>/dev/null | grep '^net/minecraft/.*\.class$' | sed "s#\$# $j#"; done > classes.txt
          fqn() { grep -E "/$1\.class " classes.txt | awk '{print $1}' | sed 's#/#.#g; s#\.class$##' | head -1; }
          show() { F=$(fqn $1); echo "=== $1 ($F)"; if [ -n "$F" ]; then javap -p -cp "$CP" "$F" | grep -v lambda | grep -E "${2:-.}"; fi; true; }
          show EntityModel '.'
          show PlayerFaceExtractor '.'
          show TeamColor '.'
          show Team 'olor'
          show Minecraft 'arget'
          show Options 'ide'
          show InventoryScreen 'ntity'
          show ChatComponent 'ddMessage|ddClient'
          show LevelRenderer 'utline'
          show GameRenderer 'rojection|etFov|ostEffect'
          show FogRenderer 'og'
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modulesmod-jar
          path: build/libs/modulesmod-*.jar

      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
